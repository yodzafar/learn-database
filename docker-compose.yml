# learn-database: barcha DBlar bitta compose faylda, har biri o'z profilida.
# Ishga tushirish: make up db=postgres  (yoki: docker compose --profile postgres up -d)
# Guruhlar: make up db=rdbms | nosql | de
#
# Hamma konteynerga loyiha ildizi /work sifatida faqat o'qish uchun ulanadi,
# shuning uchun `make run d=...` fayllarni konteyner ichidan to'g'ridan-to'g'ri o'qiydi.
# Parollar faqat lokal o'quv muhiti uchun. Haqiqiy loyihada hech qachon bunday qilmang.

name: ldb

services:
  # ---------------- Relational ----------------
  postgres:
    build: ./docker/postgres
    image: ldb/postgres:18
    container_name: ldb-postgres
    profiles: [postgres, rdbms, all]
    environment:
      POSTGRES_PASSWORD: ldb
      POSTGRES_DB: ldb
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements,pg_cron,auto_explain
      - -c
      - cron.database_name=ldb
      - -c
      - track_io_timing=on
      - -c
      - wal_level=logical
    ports: ["5432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql
      - ./:/work:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ldb"]
      interval: 5s
      retries: 20

  mysql:
    image: mysql:8.4
    container_name: ldb-mysql
    profiles: [mysql, rdbms, all]
    environment:
      MYSQL_ROOT_PASSWORD: ldb
      MYSQL_DATABASE: ldb
    command:
      - --log-bin-trust-function-creators=1
      - --local-infile=1
      - --performance-schema=ON
    ports: ["3306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./:/work:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -pldb --silent"]
      interval: 5s
      retries: 30

  # Rasmiy image faqat amd64. Apple Silicon'da Docker Desktop yoki OrbStack Rosetta bilan ishlaydi.
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: ldb-mssql
    profiles: [mssql, rdbms, all]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Ldb_Passw0rd!"
      MSSQL_PID: Developer
      MSSQL_AGENT_ENABLED: "true"
    ports: ["1433:1433"]
    volumes:
      - mssql-data:/var/opt/mssql
      - ./:/work:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Ldb_Passw0rd!' -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      retries: 30

  # gvenzl/oracle-free: Oracle Database 23ai Free, arm64 ham bor. Ilova foydalanuvchisi: ldb/ldb, PDB: FREEPDB1.
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: ldb-oracle
    profiles: [oracle, rdbms, all]
    environment:
      ORACLE_PASSWORD: ldb
      APP_USER: ldb
      APP_USER_PASSWORD: ldb
    ports: ["1521:1521"]
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./:/work:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      retries: 60

  # ---------------- NoSQL ----------------
  # Bitta tugunli replica set: tranzaksiya va change stream uchun shart.
  mongodb:
    image: mongo:8.0
    container_name: ldb-mongodb
    profiles: [mongodb, nosql, all]
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes:
      - mongo-data:/data/db
      - ./:/work:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "try { rs.status().ok } catch (e) {
          rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }"
      interval: 5s
      retries: 30

  cassandra:
    image: cassandra:5.0
    container_name: ldb-cassandra
    profiles: [cassandra, nosql, all]
    environment:
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
      CASSANDRA_CLUSTER_NAME: ldb
    ports: ["9042:9042"]
    volumes:
      - cassandra-data:/var/lib/cassandra
      - ./:/work:ro
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' >/dev/null"]
      interval: 15s
      retries: 40

  # Redis 8: Query Engine, JSON, TimeSeries, probabilistic tuzilmalar asosiy distributivda.
  redis:
    image: redis:8.0
    container_name: ldb-redis
    profiles: [redis, nosql, all]
    ports: ["6379:6379"]
    volumes:
      - redis-data:/data
      - ./:/work:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: ldb-dynamodb
    profiles: [dynamodb, nosql, all]
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    user: root
    ports: ["8000:8000"]
    volumes:
      - dynamodb-data:/home/dynamodblocal/data

  # ---------------- Search va Graph ----------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: ldb-elasticsearch
    profiles: [elasticsearch, all]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports: ["9200:9200"]
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    container_name: ldb-kibana
    profiles: [elasticsearch, all]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports: ["5601:5601"]
    depends_on: [elasticsearch]

  neo4j:
    image: neo4j:5
    container_name: ldb-neo4j
    profiles: [neo4j, graph, all]
    environment:
      NEO4J_AUTH: neo4j/ldbpassword
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
    ports: ["7474:7474", "7687:7687"]
    volumes:
      - neo4j-data:/data
      - ./:/work:ro

  # ---------------- Analytics ----------------
  # Native port 9000 MinIO bilan to'qnashmasligi uchun tashqarida 19000.
  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    container_name: ldb-clickhouse
    profiles: [clickhouse, de, all]
    environment:
      CLICKHOUSE_USER: ldb
      CLICKHOUSE_PASSWORD: ldb
      CLICKHOUSE_DB: ldb
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    ports: ["8123:8123", "19000:9000"]
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./:/work:ro

  # TimescaleDB alohida konteynerda (5433), asosiy postgres'ni toza saqlash uchun.
  timescale:
    image: timescale/timescaledb:latest-pg17
    container_name: ldb-timescale
    profiles: [timescale, timeseries, all]
    environment:
      POSTGRES_PASSWORD: ldb
      POSTGRES_DB: ldb
    ports: ["5433:5432"]
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./:/work:ro

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ldb-qdrant
    profiles: [qdrant, vector, all]
    ports: ["6333:6333", "6334:6334"]
    volumes:
      - qdrant-data:/qdrant/storage

  # ---------------- NewSQL ----------------
  cockroach:
    image: cockroachdb/cockroach:latest-v24.3
    container_name: ldb-cockroach
    profiles: [cockroach, newsql, all]
    command: ["start-single-node", "--insecure", "--http-addr=0.0.0.0:8080"]
    ports: ["26257:26257", "8081:8080"]
    volumes:
      - cockroach-data:/cockroach/cockroach-data
      - ./:/work:ro

  yugabyte:
    image: yugabytedb/yugabyte:latest
    container_name: ldb-yugabyte
    profiles: [yugabyte, newsql, all]
    command: ["bin/yugabyted", "start", "--background=false"]
    ports: ["5434:5433", "9043:9042", "15433:15433"]
    volumes:
      - yugabyte-data:/root/var
      - ./:/work:ro

  tidb:
    image: pingcap/tidb:latest
    container_name: ldb-tidb
    profiles: [tidb, newsql, all]
    ports: ["4000:4000", "10080:10080"]

  # ---------------- Data Engineering ----------------
  minio:
    image: minio/minio:latest
    container_name: ldb-minio
    profiles: [minio, de, all]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ldb
      MINIO_ROOT_PASSWORD: ldbpassword
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - minio-data:/data

  # Kafka 4: faqat KRaft, ZooKeeper yo'q. Bitta tugun (broker + controller).
  kafka:
    image: apache/kafka:4.0.0
    container_name: ldb-kafka
    profiles: [kafka, de, all]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports: ["9092:9092"]
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: ldb-kafka-ui
    profiles: [kafka, de, all]
    environment:
      KAFKA_CLUSTERS_0_NAME: ldb
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
    ports: ["8080:8080"]
    depends_on: [kafka]

  # Debezium Kafka Connect: CDC (postgres, mysql, sqlserver, oracle, mongodb connectorlari bor).
  connect:
    image: quay.io/debezium/connect:3.0
    container_name: ldb-connect
    profiles: [cdc, all]
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: ldb-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    ports: ["8083:8083"]
    depends_on: [kafka]

  schema-registry:
    image: confluentinc/cp-schema-registry:7.8.0
    container_name: ldb-schema-registry
    profiles: [kafka, de, all]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8085
    ports: ["8085:8085"]
    depends_on: [kafka]

  # Iceberg REST katalog, ma'lumotlar MinIO'da (s3://warehouse). Bucket'ni birinchi marta MinIO konsolida yarating.
  iceberg-rest:
    image: apache/iceberg-rest-fixture:latest
    container_name: ldb-iceberg-rest
    profiles: [iceberg, de, all]
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: ldb
      AWS_SECRET_ACCESS_KEY: ldbpassword
      AWS_REGION: us-east-1
    ports: ["8181:8181"]
    depends_on: [minio]

  trino:
    image: trinodb/trino:latest
    container_name: ldb-trino
    profiles: [trino, de, all]
    ports: ["8082:8080"]
    volumes:
      - ./docker/trino/catalog:/etc/trino/catalog:ro

volumes:
  pg-data:
  mysql-data:
  mssql-data:
  oracle-data:
  mongo-data:
  cassandra-data:
  redis-data:
  dynamodb-data:
  es-data:
  neo4j-data:
  clickhouse-data:
  timescale-data:
  qdrant-data:
  cockroach-data:
  yugabyte-data:
  minio-data:
  kafka-data:
